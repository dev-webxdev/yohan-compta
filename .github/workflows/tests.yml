name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify runner toolchain
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 ? 0 : 1);'
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) === 26 ? 0 : 1)'
      - name: Validate Composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer security audit
        run: composer audit --locked --no-interaction
      - name: Tests
        run: php artisan test
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Chromium
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e
